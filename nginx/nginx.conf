events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 25M;
    sendfile on;
    upstream backend { server backend:8000; }
    server {
        listen 80;
        server_name _;
        location / { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ /index.html; }
        location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300s; }
        location /storage/ { proxy_pass http://backend/storage/; }
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;
    }
}
