version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: capvia_ai
      POSTGRES_USER: capvia
      POSTGRES_PASSWORD: capvia_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capvia -d capvia_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [capvia_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://capvia:capvia_secure_password@postgres:5432/capvia_ai
    volumes:
      - ./storage:/app/storage
      - ./ai_model/weights:/app/ai_model/weights
    depends_on:
      postgres:
        condition: service_healthy
    networks: [capvia_net]
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [capvia_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on: [frontend, backend]
    networks: [capvia_net]

volumes:
  postgres_data:
  frontend_build:

networks:
  capvia_net:
    driver: bridge
